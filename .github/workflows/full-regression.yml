name: Full regression

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_GIT_STATUS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_GIT_STATUS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox
      - run: pnpm test:smoke
      - run: pnpm test:firefox

  pages:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_GIT_STATUS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:pages
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:pages

  platform-builds:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_GIT_STATUS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
      - run: pnpm build:android:bundle
      - run: pnpm android:prepare
