name: Regression by area

on:
  workflow_dispatch:
    inputs:
      area:
        description: Área que se debe validar
        required: true
        type: choice
        options: [editor, canvas, persistence, assets, import-export, navigation, responsive, web-mobile]

permissions:
  contents: read

concurrency:
  group: regression-${{ inputs.area }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: '1'
      EXPO_NO_GIT_STATUS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:area -- ${{ inputs.area }}
