packages:
  - apps/*
  - packages/*

# pnpm 11 no debe asumir que una instalación interrumpida sigue íntegra: valida y repara los enlaces
# antes de ejecutar scripts, evitando el estado falso «Already up to date» observado en Windows.
optimisticRepeatInstall: false

allowBuilds:
  esbuild: true
  react-native-enriched-markdown: true
  unrs-resolver: true

overrides:
  react-native-worklets: 0.10.1

patchedDependencies:
  react-native-enriched-markdown@1.1.0: patches/react-native-enriched-markdown@1.1.0.patch
